# automation-contract.conf — WP-538 Ф5а.
#
# Declares which automated processes are allowed to leave a canonical git
# checkout mirroring origin/<branch> byte-for-byte without a commit (HEAD
# just hasn't advanced yet), and exactly which paths each one is allowed to
# touch that way. canon-refresh.sh reads this file to decide whether a
# tracked-dirty tree is a known, safe mirror it may resolve with
# `git reset --soft`, or real work it must leave untouched.
#
# This is the single source of truth for that path list — sync-strategy-
# files.sh's own glob rules must match this file, not duplicate it
# separately (WP-538 Ф5а design session, 2026-09-03, consensus Kimi+Codex:
# two independently-maintained copies drift apart silently).
#
# Format: one automation per non-blank, non-comment line, tab-separated:
#   <automation-name><TAB><caller-basename><TAB><comma-separated path globs>
# Path globs use plain bash `case` glob syntax (the same the rest of this
# repo already relies on) — no external glob library.

sync-strategy-files	sync-strategy-files.sh	inbox/WP-*.md,current/*.md,MEMORY.md
