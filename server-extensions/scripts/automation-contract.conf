# automation-contract.conf — WP-538 Ф5а.
#
# Declares which automated processes are allowed to leave a canonical git
# checkout mirroring origin/<branch> byte-for-byte without a commit (HEAD
# just hasn't advanced yet), and exactly which paths each one is allowed to
# touch that way. canon-refresh.sh reads this file to decide whether a
# tracked-dirty tree is a known, safe mirror it may resolve with
# `git reset --soft`, or real work it must leave untouched.
#
# This is the single source of truth for that path list — sync-strategy-
# files.sh's own glob rules must match this file, not duplicate it
# separately (WP-538 Ф5а design session, 2026-09-03, consensus Kimi+Codex:
# two independently-maintained copies drift apart silently).
#
# Format: one automation per non-blank, non-comment line, tab-separated:
#   <automation-name><TAB><caller-basename><TAB><comma-separated path globs><TAB><mode>
# Path globs use plain bash `case` glob syntax (the same the rest of this
# repo already relies on) — no external glob library. Each glob's segment
# count must match the path's (see _automation_glob_match in
# lib/automation-contract.sh) — "*" never crosses a "/".
#
# Column 4 (mode) is optional; blank/absent means "mirror" (the original
# meaning above — a byte-for-byte copy of some origin tip, discarded with
# `git restore`/`git reset --soft`). "append" (WP-538, incident
# 2026-10-09/10) means the automation only ever appends to its own file —
# it never mirrors any origin commit, so canon-refresh.sh proves safety by
# comparing against HEAD's own content (old bytes unchanged, new bytes
# appended), not against an origin tree, and commits the append instead of
# discarding it.

sync-strategy-files	sync-strategy-files.sh	inbox/WP-*.md,inbox/WP-*/*.md,current/*.md,MEMORY.md

# 2026-10-10: the two append-mode entries (fpf-check-references, wp-reopen-gate)
# are withdrawn. try_flush_append_only() committed their writes into the frozen
# canonical checkout, but no service pushes DS-my-strategy commits (iwe-push-ahead
# does not list it), so every flush left a local-only commit or staged ledger files
# and blocked tsekh1-git-sync.sh (WP-538, peer-session 2026-10-10-03-tsekh1-sync-lag-fix).
# The append mode itself stays supported; re-declare an entry only together with a
# delivery path for the commit it creates.
