# Этот файл отвечает на вопрос «в каких копиях брокеру РАЗРЕШЕНО делать fetch» (права на получение живут
# только здесь). Как копия сходится с upstream (класс, владелец решения, пороги) — scripts/repo-convergence.registry.yaml;
# в какой организации GitHub живёт репозиторий — repo-registry/repos.md. Не дублировать факты между тремя реестрами.
# WP-530 Ф66 Требование А: явный реестр репозиториев для refs-sync-broker.sh.
# Не autodiscovery — Codex (implementation-architect, пир-сессия 2026-09-25-16,
# раунд 3): autodiscovery подбирает кандидатов, но не даёт права автоматически
# делать fetch в любом найденном репозитории. path — относительно IWE_ROOT.
# refspec обновляет только refs/remotes/<remote>/* (--no-tags флагом в самом
# скрипте, не здесь), рабочее дерево и индекс не трогаются никогда.
repos:
  - path: DS-my-strategy
    remote: origin
    refspec: "+refs/heads/main:refs/remotes/origin/main"
  - path: MC-sessions
    remote: origin
    refspec: "+refs/heads/main:refs/remotes/origin/main"
  - path: .
    optional: true  # On tsekh-1 the root is a Nix-managed mirror, not a Git repo.
    remote: origin
    refspec: "+refs/heads/main:refs/remotes/origin/main"
  # WP-539, решение пилота 03.11: читательские копии (класс reader в repo-convergence.registry.yaml).
  # Брокер только получает ссылки; рабочее дерево перематывает scripts/reader-copies-sync.py.
  - path: PACK-MIM
    remote: origin
