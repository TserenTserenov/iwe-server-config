# Реестр сходимости git-копий: КАК каждая копия репозитория сходится со своим upstream на каждом хосте.
# WP-539 Ф21 Б1; решение — DRR-f21-b1-repo-registry (DS-my-strategy/inbox/WP-539/).
#
# Три реестра, три разных вопроса (каждый факт — в одном месте):
#   * этот файл                       — как копия сходится с upstream (класс, владелец решения, пороги);
#   * scripts/refs-sync-broker.repos.yaml — в каких копиях брокеру РАЗРЕШЕНО делать fetch (права живут только там;
#                                       поле fetch_allowed в этом файле запрещено проверкой);
#   * repo-registry/repos.md          — в какой организации GitHub живёт репозиторий и куда он должен переехать.
#
# Правила:
#   * class: undecided — решение пилота не принято (это явное значение, не пропуск). canon / reader / service /
#     working допустимы только с decision_owner = {ref, scope}; смена класса — решение пилота.
#     reader — копия только читается, её перематывает scripts/reader-copies-sync.py (чистую, ff-only, по уже
#     полученной брокером ссылке); service — копию двигает служба перед запуском (проверенная синхронизация);
#     working — только видимость в сводке, никакой автоматической перемотки.
#   * Роль копии может отличаться по хостам: поле class у checkout перекрывает class записи.
#   * written_here: true — на этом хосте в копию коммитят; список Цеха для iwe-pull-repos и iwe-push-ahead
#     строится из таких копий (iwe-server-config читает JSON-копию: repo_registry.py export-json).
#   * Копия на хосте — path относительно корня IWE; purpose: copy — каталог-копия, не сходится с upstream, но
#     присутствие и ошибки чтения остаются видимыми.
#   * Пороги (thresholds): null = не задан (не ноль). Начало отсчёта у каждого своё; «неизвестно» показывается как неизвестно.
#   * Присутствие в этом файле НЕ даёт права на fetch и не включает копию в брокер.
#   * Обход сводки видит корень и вложенные каталоги до глубины 2 (DS-MCP/*, DS-IT-systems/*).
#   * Читательская копия должна быть и в refs-sync-broker.repos.yaml (иначе перематывать не на что) —
#     это проверяет тест test_readers_are_fetched (tests/test_repo_registry.py).
version: 1
repos:
  - repo_id: DS-my-strategy
    class: canon
    checkouts:
      - {host: mac, path: DS-my-strategy}
      - {host: tsekh-1, path: DS-my-strategy}
    expected_branch: main
    upstream: origin/main
    decision_owner: {ref: "WP-539 Ф21 (диагноз 29.10, заморозка канона WP-520/WP-484 Ф104)", scope: repo}
    executor: "Цех — синхронизатор канона (tsekh1-git-sync.sh); Мак — страховочный проход (backstop)"
    mutation_mechanism: "ff-only синхронизатором под замком; сессии пишут только в изолированной копии"
    thresholds: {fetch_max_age_min: 120, behind_max_commits: null, behind_observed_for_min: null, block_resolution_max_age_min: null}
