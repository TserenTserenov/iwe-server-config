    note: "До 13.11 корень Мака двигали только ручные ff агентов и сведение шлюза после своей публикации; слияния PR на GitHub его не двигали (13.11: −14 коммитов за 09:57–19:18). Работающие сессии видят новые скрипты и хуки сразу после перемотки — так было и при ручном ff."
